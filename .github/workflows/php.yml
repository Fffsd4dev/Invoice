name: Deploy Laravel Backend

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. Setup PHP
      #
      # Production server is running PHP 8.3, so CI should match.
      # ---------------------------------------------------------
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, bcmath, pdo, mysql, zip, fileinfo
          tools: composer
          coverage: none


      # ---------------------------------------------------------
      # 3. Validate Composer configuration
      # ---------------------------------------------------------
      - name: Validate Composer
        run: composer validate --strict


      # ---------------------------------------------------------
      # 4. Install dependencies for CI validation
      #
      # This vendor directory exists only inside GitHub Actions.
      # Production vendor is installed separately on the server.
      # ---------------------------------------------------------
      - name: Install Dependencies (CI check only)
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-progress \
            --no-interaction \
            --optimize-autoloader


      # ---------------------------------------------------------
      # 5. Setup SSH
      # ---------------------------------------------------------
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H "${{ secrets.SERVER_IP }}" >> ~/.ssh/known_hosts


      # ---------------------------------------------------------
      # 6. Test SSH connection
      # ---------------------------------------------------------
      - name: Test SSH Connection
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=yes \
            deploy@${{ secrets.SERVER_IP }} \
            "echo 'SSH connection successful'"


      # ---------------------------------------------------------
      # 7. Deploy application files
      #
      # NEVER overwrite:
      #
      # .env
      # vendor/
      # storage/
      # bootstrap/cache/
      # .git/
      # .github/
      # ---------------------------------------------------------
      - name: Deploy Application Files
        run: |
          rsync -avz \
            --delete \
            --exclude='.env' \
            --exclude='vendor/' \
            --exclude='storage/' \
            --exclude='bootstrap/cache/' \
            --exclude='.git/' \
            --exclude='.github/' \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes" \
            ./ \
            deploy@${{ secrets.SERVER_IP }}:/home/ffsdgroup.com/invoice_backend/


      # ---------------------------------------------------------
      # 8. Install Composer dependencies on production
      # ---------------------------------------------------------
      - name: Install Production Dependencies
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=yes \
            deploy@${{ secrets.SERVER_IP }} << 'EOF'

            set -e

            cd /home/ffsdgroup.com/invoice_backend

            echo "Installing Composer dependencies..."

            composer install \
              --no-dev \
              --prefer-dist \
              --no-interaction \
              --optimize-autoloader \
              --no-progress

            echo "Composer dependencies installed successfully."

          EOF


      # ---------------------------------------------------------
      # 9. Configure Laravel writable directories
      #
      # The application is owned by deploy.
      # LSPHP runs as ffsdg9097.
      #
      # ffsdg9097 should be a member of the deploy group.
      # ---------------------------------------------------------
      - name: Configure Laravel Permissions
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=yes \
            deploy@${{ secrets.SERVER_IP }} << 'EOF'

            set -e

            cd /home/ffsdgroup.com/invoice_backend

            echo "Configuring Laravel writable directories..."

            chmod -R 775 storage bootstrap/cache

            find storage bootstrap/cache \
              -type d \
              -exec chmod g+s {} \;

            echo "Laravel permissions configured successfully."

          EOF


      # ---------------------------------------------------------
      # 10. Run Laravel deployment commands
      # ---------------------------------------------------------
      - name: Run Laravel Commands
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=yes \
            deploy@${{ secrets.SERVER_IP }} << 'EOF'

            set -e

            cd /home/ffsdgroup.com/invoice_backend

            echo "Running database migrations..."

            php artisan migrate --force

            echo "Clearing old Laravel caches..."

            php artisan optimize:clear

            echo "Caching Laravel configuration..."

            php artisan config:cache

            echo "Caching Laravel routes..."

            php artisan route:cache

            echo "Caching Laravel views..."

            php artisan view:cache

            echo "Laravel deployment commands completed successfully."

          EOF


      # ---------------------------------------------------------
      # 11. Restart OpenLiteSpeed
      #
      # This requires deploy to have passwordless sudo permission
      # for systemctl restart lsws.
      #
      # If deploy does not have this permission, this step should
      # be removed or configured separately.
      # ---------------------------------------------------------
      - name: Restart OpenLiteSpeed
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=yes \
            deploy@${{ secrets.SERVER_IP }} << 'EOF'

            set -e

            echo "Restarting OpenLiteSpeed..."

            sudo systemctl restart lsws

            echo "OpenLiteSpeed restarted successfully."

          EOF


      # ---------------------------------------------------------
      # 12. Deployment complete
      # ---------------------------------------------------------
      - name: Deployment Successful
        run: |
          echo "=========================================="
          echo "Laravel deployment completed successfully"
          echo "=========================================="
